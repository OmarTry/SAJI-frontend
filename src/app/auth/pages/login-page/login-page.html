<div class="w-full max-w-[420px] mx-auto">
      <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm p-7 sm:p-9 text-left">
        
        <!-- Título -->
        <div class="mb-6">
          <h1 class="text-xl sm:text-2xl font-bold text-charcoal tracking-tight">Iniciar Sesión</h1>
          <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">
            Accede a tu plataforma de gestión y contabilidad fiscal bimoneda.
          </p>
        </div>

        <!-- Formulario -->
        <form (ngSubmit)="onSubmit()" class="space-y-4">
          
          <!-- Correo Electrónico -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5" for="email">
              Correo Electrónico
            </label>
            <input 
              id="email" 
              name="email" 
              type="email" 
              required
              placeholder="nombre@empresa.com"
              class="w-full h-10 px-3.5 text-xs text-charcoal bg-white rounded-lg border border-slate-300 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all"
            />
          </div>

          <!-- Contraseña -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-semibold text-slate-700" for="password">
                Contraseña
              </label>
              <a routerLink="/auth/recuperar-contrasena" class="text-xs text-primary hover:text-primary-hover font-semibold transition-colors">
                ¿Olvidaste tu contraseña?
              </a>
            </div>
            <div class="relative flex items-center">
              <input 
                id="password" 
                name="password" 
                [type]="showPassword() ? 'text' : 'password'" 
                required
                placeholder="••••••••••••"
                class="w-full h-10 pl-3.5 pr-10 text-xs text-charcoal bg-white rounded-lg border border-slate-300 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all"
              />
              <button 
                type="button" 
                (click)="togglePasswordVisibility()"
                class="absolute right-3 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer flex items-center"
                aria-label="Alternar visibilidad de contraseña">
                <span class="material-symbols-outlined text-[18px]">
                  {{ showPassword() ? 'visibility_off' : 'visibility' }}
                </span>
              </button>
            </div>
          </div>

          <!-- Recordar Sesión -->
          <div class="pt-1">
            <label class="inline-flex items-center gap-2 cursor-pointer text-xs text-slate-600">
              <input 
                type="checkbox" 
                name="rememberMe"
                class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary"
              />
              <span>Mantener sesión iniciada</span>
            </label>
          </div>

          <!-- Botón de Envío -->
          <div class="pt-2">
            <button 
              type="submit" 
              [disabled]="isLoading()"
              class="w-full h-10 px-4 rounded-lg bg-primary hover:bg-primary-hover active:bg-[#9a3412] text-white text-xs font-semibold shadow-xs transition-colors flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60">
              @if (!isLoading()) {
                <span>Ingresar</span>
                <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
              } @else {
                <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                <span>Validando credenciales...</span>
              }
            </button>
          </div>

        </form>

        <!-- Registro alternativo -->
        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
          <p class="text-xs text-slate-500">
            ¿Aún no tienes cuenta?
            <a routerLink="/auth/registrarse" class="text-primary hover:text-primary-hover font-semibold ml-1 transition-colors">
              Crear cuenta de prueba
            </a>
          </p>
        </div>

        <!-- Indicador de Seguridad -->
        <div class="mt-4 pt-3 flex items-center justify-center gap-1.5 text-[11px] text-slate-400">
          <span class="material-symbols-outlined text-[14px]">lock</span>
          <span>Cifrado SHA-256 de extremo a extremo · SENIAT</span>
        </div>

      </div>
    </div>
