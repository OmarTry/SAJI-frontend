<div class="w-full max-w-[460px] mx-auto">
      <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm p-6 sm:p-8 text-left">
        
        <!-- Encabezado de la tarjeta -->
        <div class="mb-5">
          <h1 class="text-xl sm:text-2xl font-bold text-charcoal tracking-tight">Crear Cuenta</h1>
          <p class="text-xs text-slate-500 mt-1 leading-relaxed">
            Prueba 14 días sin costo. Configuración de entorno bimoneda y homologación SENIAT inmediata.
          </p>
        </div>

        <!-- Formulario de Registro -->
        <form (ngSubmit)="onSubmit()" class="space-y-3.5">
          
          <!-- Nombre y Apellido -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1" for="fullName">
              Nombre y Apellido
            </label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-slate-400 text-[18px] pointer-events-none">
                person
              </span>
              <input 
                id="fullName"
                name="fullName"
                type="text" 
                placeholder="Ej. Alejandro Morales" 
                required
                class="w-full h-10 pl-9 pr-3.5 text-xs text-charcoal bg-white rounded-lg border border-slate-300 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all"
              />
            </div>
          </div>

          <!-- Nombre de la Empresa o Firma -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1" for="companyName">
              Nombre de la Empresa o Firma
            </label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-slate-400 text-[18px] pointer-events-none">
                apartment
              </span>
              <input 
                id="companyName"
                name="companyName"
                type="text" 
                placeholder="Ej. Inversiones San Antonio C.A." 
                required
                class="w-full h-10 pl-9 pr-3.5 text-xs text-charcoal bg-white rounded-lg border border-slate-300 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all"
              />
            </div>
          </div>

          <!-- Correo Corporativo -->
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1" for="email">
              Correo Corporativo o Profesional
            </label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-slate-400 text-[18px] pointer-events-none">
                mail
              </span>
              <input 
                id="email"
                name="email"
                type="email" 
                placeholder="alejandro@empresa.com" 
                required
                class="w-full h-10 pl-9 pr-3.5 text-xs text-charcoal bg-white rounded-lg border border-slate-300 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all"
              />
            </div>
          </div>

          <!-- Fila de Contraseñas (2 Columnas para ahorrar altura en pantalla) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            
            <!-- Contraseña -->
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1" for="password">
                Contraseña
              </label>
              <div class="relative flex items-center">
                <input 
                  id="password"
                  name="password"
                  [type]="showPassword() ? 'text' : 'password'" 
                  placeholder="••••••••••••" 
                  required
                  class="w-full h-10 pl-3 pr-8 text-xs text-charcoal bg-white rounded-lg border border-slate-300 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all"
                />
                <button 
                  type="button" 
                  (click)="togglePasswordVisibility()"
                  class="absolute right-2 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer flex items-center"
                  aria-label="Alternar visibilidad de contraseña">
                  <span class="material-symbols-outlined text-[17px]">
                    {{ showPassword() ? 'visibility_off' : 'visibility' }}
                  </span>
                </button>
              </div>
            </div>

            <!-- Confirmar Contraseña -->
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1" for="confirmPassword">
                Confirmar
              </label>
              <div class="relative flex items-center">
                <input 
                  id="confirmPassword"
                  name="confirmPassword"
                  [type]="showConfirmPassword() ? 'text' : 'password'" 
                  placeholder="••••••••••••" 
                  required
                  class="w-full h-10 pl-3 pr-8 text-xs text-charcoal bg-white rounded-lg border border-slate-300 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all"
                />
                <button 
                  type="button" 
                  (click)="toggleConfirmPasswordVisibility()"
                  class="absolute right-2 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer flex items-center"
                  aria-label="Alternar visibilidad de confirmación">
                  <span class="material-symbols-outlined text-[17px]">
                    {{ showConfirmPassword() ? 'visibility_off' : 'visibility' }}
                  </span>
                </button>
              </div>
            </div>

          </div>

          <p class="text-[11px] text-slate-400">Mínimo 8 caracteres, al menos un número y símbolo.</p>

          <!-- Checkbox Términos -->
          <div class="flex items-start gap-2 pt-0.5">
            <input 
              id="terms" 
              name="terms"
              type="checkbox" 
              required
              class="mt-0.5 h-3.5 w-3.5 rounded border-slate-300 text-primary focus:ring-primary cursor-pointer"
            />
            <label for="terms" class="text-xs text-slate-600 cursor-pointer select-none leading-tight">
              Acepto los <a routerLink="/policy" class="text-charcoal font-semibold hover:underline">Términos de Servicio</a> y la <a routerLink="/policy" class="text-charcoal font-semibold hover:underline">Privacidad Fiscal</a>.
            </label>
          </div>

          <!-- Botón de acción principal -->
          <div class="pt-1.5">
            <button 
              type="submit" 
              [disabled]="isLoading() || !acceptTerms"
              class="w-full h-10 px-4 rounded-lg bg-primary hover:bg-primary-hover active:bg-[#9a3412] text-white text-xs font-semibold shadow-xs transition-colors flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60">
              @if (!isLoading()) {
                <span>Crear Espacio de Trabajo</span>
                <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
              } @else {
                <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                <span>Aprovisionando espacio...</span>
              }
            </button>
          </div>

        </form>

        <!-- Footer de la tarjeta -->
        <div class="mt-5 pt-4 border-t border-slate-100 flex flex-col items-center gap-2.5 text-center">
          <p class="text-xs text-slate-500">
            ¿Ya tienes una cuenta registrada?
            <a routerLink="/auth/iniciar-sesion" class="text-primary hover:text-primary-hover font-semibold ml-1 transition-colors">
              Iniciar Sesión
            </a>
          </p>
          <div class="inline-flex items-center gap-1.5 text-[11px] text-slate-400">
            <span class="material-symbols-outlined text-[14px]">lock</span>
            <span>Conexión cifrada de extremo a extremo · Datos respaldados</span>
          </div>
        </div>

      </div>
    </div>
